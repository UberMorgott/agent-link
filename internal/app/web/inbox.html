<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="agentlink-token" content="{{TOKEN}}">
<meta name="agentlink-strings" content="{{STRINGS}}">
<meta name="agentlink-title" content="page.title.inbox">
<title></title>
<link rel="stylesheet" href="/ui/static/style.css">
</head>
<body>
<nav><strong>agentlink</strong> <a href="/ui/settings" data-t="nav.settings"></a> <a href="/ui/inbox" class="active" data-t="nav.inbox"></a> <span id="status"></span></nav>
<main>
<h1 data-t="inbox.h1"></h1>
<form id="send">
  <fieldset>
    <legend data-t="inbox.send.legend"></legend>
    <label><span data-t="inbox.to.label"></span><input name="to" id="to" required></label>
    <p class="hint" data-t="inbox.to.hint"></p>
    <label><span data-t="inbox.body.label"></span><textarea name="body" id="body" rows="4" required></textarea></label>
    <p class="hint" data-t="inbox.body.hint"></p>
    <input type="hidden" name="reply_to" id="reply_to">
    <p id="replying" hidden><span id="replying_text"></span> <button type="button" id="cancel_reply" data-t="inbox.cancel_reply"></button></p>
    <button type="submit" data-t="inbox.send"></button>
    <p id="result" role="status"></p>
  </fieldset>
</form>
<ul id="messages"></ul>
</main>
<script src="/ui/static/common.js"></script>
<script src="/ui/static/inbox.js"></script>
</body>
</html>
