<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="agentlink-token" content="{{TOKEN}}">
<meta name="agentlink-version" content="{{VERSION}}">
<meta name="agentlink-strings" content="{{STRINGS}}">
<meta name="agentlink-title" content="page.title.dashboard">
<title></title>
<link rel="icon" href="/ui/static/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/ui/static/style.css">
</head>
<body>
<div id="app-shell" class="app-shell">
  <aside id="sidebar" aria-labelledby="nav_label">
    <div class="brand"><span class="brand-mark" aria-hidden="true">a</span><strong>agentlink</strong></div>
    <span id="nav_label" class="sr-only" data-t="nav.label"></span>
    <nav aria-labelledby="nav_label">
      <a href="/ui/dashboard" data-route="dashboard"><svg class="nav-icon" viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="3" width="5.5" height="5.5" rx="1.5"/><rect x="11.5" y="3" width="5.5" height="5.5" rx="1.5"/><rect x="3" y="11.5" width="5.5" height="5.5" rx="1.5"/><rect x="11.5" y="11.5" width="5.5" height="5.5" rx="1.5"/></svg><span class="nav-text" data-t="nav.dashboard"></span></a>
      <a href="/ui/inbox" data-route="inbox"><svg class="nav-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 4.5h12a1.5 1.5 0 0 1 1.5 1.5v7a1.5 1.5 0 0 1-1.5 1.5H9l-3.5 3v-3H4A1.5 1.5 0 0 1 2.5 13V6A1.5 1.5 0 0 1 4 4.5z"/></svg><span class="nav-text" data-t="nav.inbox"></span></a>
      <a href="/ui/participants" data-route="participants"><svg class="nav-icon" viewBox="0 0 20 20" aria-hidden="true"><circle cx="7.5" cy="7" r="3"/><path d="M2 16.5c.6-2.8 2.8-4.5 5.5-4.5s4.9 1.7 5.5 4.5"/><path d="M13 4.2a3 3 0 0 1 0 5.6M15 12.3c1.5.6 2.6 2.1 3 4.2"/></svg><span class="nav-text" data-t="nav.participants"></span></a>
      <a href="/ui/settings" data-route="settings"><svg class="nav-icon" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="2.6"/><path d="M10 2.5v2.2M10 15.3v2.2M2.5 10h2.2M15.3 10h2.2M4.7 4.7l1.6 1.6M13.7 13.7l1.6 1.6M4.7 15.3l1.6-1.6M13.7 6.3l1.6-1.6"/></svg><span class="nav-text" data-t="nav.settings"></span></a>
    </nav>
  </aside>
  <section class="workspace">
    <header id="topbar"><span id="status"></span></header>
    <main id="view" tabindex="-1">
      <section data-view="dashboard">
        <header class="view-header"><h1 data-t="dashboard.h1"></h1></header>
        <p id="dashboard_summary" class="hint"></p>
        <div id="dashboard_cards" class="dashboard-cards"></div>
        <section aria-labelledby="dashboard_recent_title">
          <h2 id="dashboard_recent_title" data-t="dashboard.recent"></h2>
          <ul id="dashboard_recent" class="dashboard-recent"></ul>
        </section>
      </section>
      <section data-view="inbox" hidden>
        <h1 class="sr-only" data-t="inbox.h1"></h1>
        <div id="conversation_layout" class="conversation-layout">
          <aside class="conversation-sidebar" aria-labelledby="chat_list_title">
            <div class="chat-list-head">
              <h2 id="chat_list_title" data-t="inbox.list.label"></h2>
              <button type="button" id="new_chat" class="new-chat-button"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg><span data-t="inbox.new"></span></button>
            </div>
            <ul id="conversation_list" class="conversation-list"></ul>
            <div class="chat-list-foot">
              <button type="button" id="archive_toggle" class="archive-toggle" aria-pressed="false"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="3.5" width="15" height="4" rx="1"/><path d="M4 7.5v8a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-8M8 11h4"/></svg><span id="archive_toggle_text" data-t="inbox.archive.show"></span></button>
              <span class="link-status"></span>
            </div>
          </aside>
          <section id="conversation_panel" class="conversation-panel" aria-labelledby="conversation_title">
            <header class="chat-head">
              <button type="button" id="chat_back" class="chat-back"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4.5 7 10l5.5 5.5"/></svg><span data-t="inbox.back"></span></button>
              <div class="chat-head-main">
                <h2 id="conversation_title" data-t="inbox.select"></h2>
                <p id="chat_subtitle" class="chat-subtitle"></p>
              </div>
              <details id="chat_info" class="chat-info">
                <summary><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7.5"/><path d="M10 9v5M10 6.2v.1"/></svg><span class="sr-only" data-t="inbox.info"></span></summary>
                <div class="chat-info-panel">
                  <h3 data-t="inbox.participants.label"></h3>
                  <ul id="chat_members" class="chat-members"></ul>
                  <h3 data-t="inbox.info.sessions"></h3>
                  <ul id="chat_sessions" class="chat-sessions"></ul>
                </div>
              </details>
              <button type="button" id="chat_close" class="chat-close" hidden><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="3.5" width="15" height="4" rx="1"/><path d="M4 7.5v8a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-8M8 11h4"/></svg><span data-t="inbox.close"></span></button>
            </header>
            <ul id="messages" class="conversation-timeline"></ul>
            <ul id="chat_activity" class="chat-activity" hidden></ul>
            <form id="send" class="composer">
              <div id="ask_row" class="ask-row" role="group" aria-labelledby="ask_label"><span id="ask_label" class="field-label" data-t="inbox.ask.label"></span><span id="ask_choices" class="ask-choices"></span><span id="ask_hint" class="ask-hint" data-t="inbox.ask.none"></span></div>
              <div class="composer-box">
                <p id="replying" class="replying" hidden><span id="replying_text"></span> <button type="button" id="cancel_reply" data-t="inbox.cancel_reply"></button></p>
                <input type="hidden" name="reply_to" id="reply_to">
                <div class="composer-row">
                  <label class="composer-body"><span class="sr-only" data-t="inbox.body.label"></span><textarea name="body" id="body" rows="1"></textarea></label>
                  <button type="submit" id="send_button" class="send-button"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 16V4.5M5 9.5l5-5 5 5"/></svg><span class="sr-only" data-t="inbox.send"></span></button>
                </div>
              </div>
              <p id="inbox_result" class="composer-result" role="status"></p>
            </form>
            <p id="chat_note" class="chat-note" hidden><span id="chat_note_text"></span> <button type="button" id="chat_note_action" hidden></button></p>
            <form id="new_chat_form" class="new-chat" hidden>
              <p class="hint" data-t="inbox.new.hint"></p>
              <div class="new-chat-group" role="group" aria-labelledby="new_chat_people"><span id="new_chat_people" class="field-label" data-t="inbox.new.participants"></span><span id="new_chat_members" class="ask-choices"></span></div>
              <p id="new_chat_empty" class="hint" hidden data-t="inbox.new.no_members"></p>
              <label><span data-t="inbox.new.area"></span><input name="area" id="new_chat_area" autocomplete="off" spellcheck="false" list="new_chat_areas"></label>
              <datalist id="new_chat_areas"></datalist>
              <p class="hint" data-t="inbox.new.area.hint"></p>
              <div class="new-chat-actions"><p id="new_chat_result" role="status"></p><button type="button" id="new_chat_dismiss" data-t="inbox.new.dismiss"></button><button type="submit" id="new_chat_create" data-t="inbox.new.create"></button></div>
            </form>
          </section>
        </div>
      </section>
      <section data-view="participants" hidden>
        <header class="view-header"><h1 data-t="participants.h1"></h1></header>
        <form id="participant_add" class="card participant-add" novalidate>
            <h2 data-t="participants.add.legend"></h2>
            <label><span data-t="participants.add.label"></span>
              <span class="row"><input name="participant_addr" id="participant_addr" autocomplete="off" spellcheck="false">
              <button type="submit" id="add_participant" data-t="participants.add.submit"></button></span>
            </label>
            <p class="hint" data-t="participants.add.hint"></p>
            <p id="participants_result" role="status"></p>
        </form>
        <p id="participants_empty" class="hint" hidden data-t="participants.empty"></p>
        <ul id="participants" class="participant-list"></ul>
      </section>
      <section data-view="settings" hidden>
        <header class="view-header"><h1 data-t="settings.h1"></h1></header>
        <form id="form" novalidate>
          <div class="settings-grid">
          <section class="card settings-card" data-settings-card="identity" aria-labelledby="settings_identity_title">
            <h2 id="settings_identity_title" data-t="settings.identity.title"></h2>
            <label><span data-t="settings.node.label"></span><input name="node" autocomplete="off"></label>
            <p class="hint" data-t="settings.node.hint"></p>
            <label><span data-t="settings.code.label"></span>
              <span class="row"><input name="code" id="code" maxlength="16" autocomplete="off" spellcheck="false" class="code">
              <button type="button" id="generate" data-t="settings.code.generate"></button>
              <button type="button" id="copy" data-t="settings.code.copy"></button></span>
            </label>
            <p class="hint" data-t="settings.code.hint"></p>
          </section>
          <section class="card settings-card" data-settings-card="handler" aria-labelledby="settings_handler_title">
            <h2 id="settings_handler_title" data-t="settings.handler.title"></h2>
            <label><span data-t="settings.handler.label"></span>
              <select name="handler">
                <option value="none" data-t="settings.handler.none"></option>
                <option value="claude" data-t="settings.handler.claude"></option>
                <option value="codex" data-t="settings.handler.codex"></option>
              </select>
            </label>
            <p class="hint" data-t="settings.handler.hint"></p>
            <p class="handler-note" data-t="settings.handler.context"></p>
            <div id="agent_row">
              <span data-t="settings.agent.label"></span>
              <span class="row"><span id="agent_shown"></span>
              <button type="button" id="find_agent" data-t="settings.agent.find"></button>
              <button type="button" id="pick_agent" data-t="settings.agent.pick"></button></span>
              <input type="hidden" name="agent_path" id="agent_path">
              <p class="hint" data-t="settings.agent.hint"></p>
            </div>
            <label class="check"><input type="checkbox" name="auto_answer"> <span data-t="settings.auto_answer.label"></span></label>
            <p class="hint" data-t="settings.auto_answer.hint"></p>
          </section>
          <section class="card settings-card" data-settings-card="application" aria-labelledby="settings_application_title">
            <h2 id="settings_application_title" data-t="settings.application.title"></h2>
            <label><span data-t="settings.work_dir.label"></span>
              <span class="row"><input name="work_dir" id="work_dir" autocomplete="off" spellcheck="false">
              <button type="button" id="pick" data-t="settings.work_dir.pick"></button></span>
            </label>
            <p class="path" id="work_dir_shown"></p>
            <p class="hint" id="work_dir_hooks"></p>
            <p class="hint" id="hooks_codex" data-t="settings.hooks.codex" hidden></p>
            <p class="hint" data-t="settings.work_dir.hint"></p>
            <label class="check"><input type="checkbox" name="autostart"> <span data-t="settings.autostart.label"></span></label>
          </section>
          <section class="card settings-card settings-projects" data-settings-card="projects" aria-labelledby="settings_projects_title">
            <h2 id="settings_projects_title" data-t="settings.projects.title"></h2>
            <p class="hint" data-t="settings.projects.hint"></p>
            <p class="hint warn" data-t="settings.projects.warn"></p>
            <p id="projects_empty" class="hint" data-t="settings.projects.empty"></p>
            <ul id="projects" class="project-list"></ul>
            <button type="button" id="add_project" data-t="settings.projects.add"></button>
          </section>
          <section id="updates" class="card settings-card" data-settings-card="updates" aria-labelledby="settings_updates_title">
            <h2 id="settings_updates_title" data-t="update.legend"></h2>
            <p class="row update-actions"><span id="update_version"></span>
              <button type="button" id="update_check" data-t="update.check"></button>
              <button type="button" id="update_apply" hidden></button></p>
            <p class="hint" id="update_text" role="status"></p>
            <label class="check"><input type="checkbox" id="update_auto"> <span data-t="update.auto"></span></label>
            <p class="hint" data-t="update.auto.hint"></p>
          </section>
          <section class="card settings-card settings-advanced" data-settings-card="advanced">
          <details id="advanced">
            <summary><span data-t="settings.advanced"></span></summary>
            <div class="advanced-fields">
              <label><span data-t="settings.listen.label"></span><input name="listen" autocomplete="off"></label>
              <p class="hint" data-t="settings.listen.hint"></p>
              <p class="hint" id="my_addr"></p>
              <label><span data-t="settings.api.label"></span><input name="api" autocomplete="off" placeholder="127.0.0.1:7520"></label>
              <p class="hint" data-t="settings.api.hint"></p>
              <label><span data-t="settings.areas.label"></span><input name="areas" autocomplete="off"></label>
              <p class="hint" data-t="settings.areas.hint"></p>
              <label class="check"><input type="checkbox" name="discovery"> <span data-t="settings.discovery.label"></span></label>
              <p class="hint" data-t="settings.discovery.hint"></p>
              <label><span data-t="settings.max_jobs.label"></span><input name="max_jobs" type="number" min="1" max="4" step="1" placeholder="2"></label>
              <p class="hint" data-t="settings.max_jobs.hint"></p>
            </div>
          </details>
          </section>
          <footer class="settings-actions"><p id="settings_result" role="status"></p></footer>
          </div>
        </form>
      </section>
    </main>
  </section>
  <div id="toast-region" role="status" aria-live="polite">
    <div id="connection-banner"></div>
    <div id="message-toast-region" class="message-toast-region"></div>
  </div>
</div>
<script src="/ui/static/common.js"></script>
<script src="/ui/static/overview.js"></script>
<script src="/ui/static/inbox.js"></script>
<script src="/ui/static/participants.js"></script>
<script src="/ui/static/settings.js"></script>
<script src="/ui/static/app.js"></script>
</body>
</html>
