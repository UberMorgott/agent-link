<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="agentlink-token" content="{{TOKEN}}">
<meta name="agentlink-strings" content="{{STRINGS}}">
<meta name="agentlink-title" content="page.title.settings">
<title></title>
<link rel="stylesheet" href="/ui/static/style.css">
</head>
<body>
<nav><strong>agentlink</strong> <a href="/ui/settings" class="active" data-t="nav.settings"></a> <a href="/ui/inbox" data-t="nav.inbox"></a> <span id="status"></span></nav>
<main>
<h1 data-t="settings.h1"></h1>
<form id="form">
  <fieldset>
    <legend data-t="settings.self.legend"></legend>
    <label><span data-t="settings.node.label"></span><input name="node" required pattern="[A-Za-z0-9][A-Za-z0-9_\-]{0,63}"></label>
    <p class="hint" data-t="settings.node.hint"></p>
    <label><span data-t="settings.listen.label"></span><input name="listen" required></label>
    <p class="hint" data-t="settings.listen.hint"></p>
  </fieldset>
  <fieldset>
    <legend data-t="settings.peer.legend"></legend>
    <label><span data-t="settings.peer_name.label"></span><input name="peer_name" required pattern="[A-Za-z0-9][A-Za-z0-9_\-]{0,63}"></label>
    <p class="hint" data-t="settings.peer_name.hint"></p>
    <label><span data-t="settings.peer_addr.label"></span><input name="peer_addr" required></label>
    <p class="hint" data-t="settings.peer_addr.hint"></p>
    <label><span data-t="settings.secret.label"></span>
      <span class="row"><input name="secret" id="secret" type="password" required minlength="16" autocomplete="off">
      <button type="button" id="show" data-t="settings.secret.show"></button>
      <button type="button" id="generate" data-t="settings.secret.generate"></button>
      <button type="button" id="copy" data-t="settings.secret.copy"></button></span>
    </label>
    <p class="hint" data-t="settings.secret.hint"></p>
    <label><span data-t="settings.areas.label"></span><input name="areas"></label>
    <p class="hint" data-t="settings.areas.hint"></p>
  </fieldset>
  <fieldset>
    <legend data-t="settings.handler.legend"></legend>
    <label><span data-t="settings.handler.label"></span>
      <select name="handler">
        <option value="none" data-t="settings.handler.none"></option>
        <option value="claude" data-t="settings.handler.claude"></option>
        <option value="codex" data-t="settings.handler.codex"></option>
      </select>
    </label>
    <p class="hint" data-t="settings.handler.hint"></p>
    <label><span data-t="settings.work_dir.label"></span><input name="work_dir"></label>
    <p class="hint" data-t="settings.work_dir.hint"></p>
    <label class="check"><input type="checkbox" name="autostart"> <span data-t="settings.autostart.label"></span></label>
  </fieldset>
  <button type="submit" data-t="settings.save"></button>
  <p id="result" role="status"></p>
</form>
</main>
<script src="/ui/static/common.js"></script>
<script src="/ui/static/settings.js"></script>
</body>
</html>
