# Lefthook owns the git hook wiring; `aegis verify` owns the checks (gofmt, go
# build, go vet, go test, aegis-lint, web checks when web files change).
# Activated by `lefthook install`. Switched from qgate 2026-09-30.
#
# `aegis verify` with no flags measures the working tree (staged + unstaged)
# against HEAD -- exactly the change about to be committed. Failures it proves
# pre-existing on HEAD are reported but do not block (profile fast).
#
# VERIFIED TRAP (lefthook 2.1.12, Windows): a job written as
#   run: pwsh -NoProfile -Command "exit 1"
# is reported as SUCCESS -- the exit code is swallowed. A bare executable
# propagates it correctly, and so does `pwsh -NoProfile -File <script>`. Never
# -Command, never wrapped in `cmd /c` (also swallows it). Related: lefthook
# issue #1256.
#
# lefthook runs jobs through a Git shell on Windows, which does not apply
# PATHEXT, so the Msys branch names `aegis.exe` explicitly (same reason the old
# gate needed `qgate.cmd`: bare names of .cmd shims give exit 127).
#
# SECOND VERIFIED TRAP: never probe with `command -v <tool>` -- under sh.exe it
# can report not-found for a tool that runs fine, while bash.exe finds it, so a
# typed `lefthook run pre-commit` passes and a real `git commit` exits 127 and
# BLOCKS THE COMMIT. Switch on the platform, never probe.
#
# THIRD VERIFIED TRAP: lefthook STRIPS QUOTES from this string before handing it
# to the shell (`case "$(uname -s)"` arrived as `case $(uname` + `-s)`; a quoted
# `MSYS|MINGW` became a pipe). So this line must contain NO quotes at all.
# `uname -o` is one word -- Msys under both Git\usr\bin\sh.exe and
# Git\bin\bash.exe -- unlike `uname -s` (MSYS_NT vs MINGW64_NT). On a POSIX box
# `uname -o` prints something else or fails; either way the else branch is right.
pre-commit:
  jobs:
    - &quality_gate
      name: aegis-verify
      run: 'if uname -o 2>/dev/null | grep -q Msys; then aegis.exe verify; else aegis verify; fi'

# A merge that commits on its own does NOT run pre-commit: git runs
# pre-merge-commit for that. Measured on git 2.53 -- with only pre-commit
# installed, `git merge --no-ff` lands the merge commit and NO hook runs at all.
# Two branches that are each clean can merge into a tree that does not build (both
# sides adding the same field is a clean textual merge and a redeclaration), so the
# break walks onto main and the next ordinary commit is the one that gets blocked,
# by a failure it did not cause.
#
# The YAML anchor is deliberate: one run line, two hooks, so they cannot drift.
#
# Not covered here, because git offers nothing to cover it with: `git cherry-pick`
# and `git revert` run neither hook (measured -- only prepare-commit-msg and
# post-commit fire). prepare-commit-msg CAN abort them, but it receives source
# "message" for an ordinary commit too, so wiring the gate there would run it twice
# on every normal commit. `git commit --amend` and `git merge --squash` both go
# through pre-commit and are already covered.
pre-merge-commit:
  jobs:
    - *quality_gate

# The agent Stop hook is deliberately NOT generated through lefthook's `ai:`
# key. Measured on 2.1.12: the generated command is `lefthook run <hook>`, which
# exits 1 on failure -- but Claude Code only blocks the turn on exit **2**, so
# the generated wiring would run the gate and then let the agent finish anyway.
