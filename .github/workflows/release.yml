name: Release

# Started by hand only (Actions -> Release -> Run workflow, with an existing
# v* tag): releases are normally built and published locally with
# scripts/release.ps1 -Publish, so a pushed tag runs nothing here. Vet and
# test, build the stripped UPX-packed agentlink.exe with scripts/release.ps1
# (the same script as a local release), attest its
# build provenance and publish the GitHub release that self-update reads
# (`gh attestation verify agentlink.exe --repo UberMorgott/agent-link`). The
# release holds that one file; self-update checks it against the sha256
# digest GitHub reports for the asset. Windows runner: the tests exercise the
# Windows process and tray code.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing v* tag to release, e.g. v0.6.4'
        required: true
        type: string

permissions:
  contents: write     # create the release and upload assets
  id-token: write     # OIDC token for the provenance attestation
  attestations: write # store the attestation

jobs:
  release:
    env:
      TAG: ${{ inputs.tag }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0 # scripts/release-notes.ps1 reads the previous tag and its commits

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          check-latest: true

      # Publishing is effectively irreversible, so the release re-verifies the
      # tagged commit instead of trusting an earlier run.
      - name: Vet
        run: go vet ./...

      # Linux is not released, but its code must keep compiling.
      - name: Vet (linux)
        run: go vet ./...
        env:
          GOOS: linux

      - name: Test
        run: go test ./...

      - name: Install UPX
        run: choco install upx --no-progress -y

      - name: Build agentlink.exe (stripped, trimpath, UPX-packed)
        shell: pwsh
        run: ./scripts/release.ps1 -Version "$env:TAG"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: 'dist/agentlink.exe'

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/release-notes.ps1 -Tag "$env:TAG" -Repo "$env:GITHUB_REPOSITORY" | Set-Content -Encoding utf8NoBOM notes.md
          gh release create "$env:TAG" dist/agentlink.exe --repo "$env:GITHUB_REPOSITORY" --title "$env:TAG" --notes-file notes.md
          if ($LASTEXITCODE) { exit 1 }
